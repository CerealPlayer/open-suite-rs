services:
  db:
    image: postgres:17.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  rustfs:
    image: rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /data:/data
